grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: CLUSTER.pharmacogenetic_result.v1
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype:  openEHR-EHR-CLUSTER.pharmacogenetic_result.v1
    revision: 1.1.8
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Observation

mappings:
  - name: "status"
    with:
      fhir: "$resource"
      openehr: "$archetype/items[at0005]"

  - name: "issued"
    with:
      fhir: "$resource.issued"
      openehr: "$archetype/items[at0006]"

  - name: "analyteMeasurement"
    with:
      fhir: "$resource.value"
      openehr: "$archetype/items[at0001]"

  - name: "analyteName"
    with:
      fhir: "$resource.code"
      openehr: "$archetype/items[at0024]"

  - name: "interpretation"
    with:
      fhir: "$resource.interpretation"
      openehr: "$archetype/items[at0004]"

  - name: "testmethod"
    with:
      fhir: "$resource.method"
      openehr: "$archetype/items[at0028]"  # was before according to test fhir payload mapped to method.text

  - name: "specimen"
    with:
      fhir: "$resource.specimen"
      openehr: "$archetype/items[at0026]"
      type: "NONE"
    followedBy:
      mappings:
        - name: "identifier"
          with:
            fhir: "$fhirRoot.as(Reference).identifier"
            openehr: "$openehrRoot"
          openehrCondition:
            targetRoot: "$openehrRoot"
            targetAttribute: "links"
            operator: "empty"

        - name: "identifierInReference"
          with:
            fhir: "$fhirRoot.as(Specimen)"
            openehr: "$reference"
          openehrCondition:
            targetRoot: "$openehrRoot"
            targetAttribute: "links"
            operator: "not empty"
          reference:
            resourceType: "Specimen"
            mappings:
              - name: "identifierInReference"
                with:
                  fhir: "$fhirRoot.identifier"
                  openehr: "$openehrRoot"
              - name: "specimenLink"
                with:
                  fhir: "$fhirRoot"
                  openehr: "$openehrRoot/links" # will use link
                link:
                  meaning: "the specimen related to this analyte"
                  type: "specimen"

  - name: "comment"
    with:
      fhir: "$resource.note.text"
      openehr: "$archetype/items[at0057]"



